# docker-compose.staging.yml
# ============================================================
#  RxPrescribe — Staging deployment
#  Usage:  docker compose -f docker-compose.staging.yml up -d
#  All secrets must be set in .env.staging (never committed)
# ============================================================

services:

  backend:
    platform: linux/amd64
    image: saurabh896/clinical-management-backend:latest
    container_name: clinical-management-backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      PDF_SERVICE_URL: http://pdf-service:3001
      PDF_BASE_URL: ${PDF_BASE_URL}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      STRIPE_PRICE_MONTHLY: ${STRIPE_PRICE_MONTHLY}
      STRIPE_PRICE_ANNUAL: ${STRIPE_PRICE_ANNUAL}
      STRIPE_SUCCESS_URL: ${STRIPE_SUCCESS_URL}
      STRIPE_CANCEL_URL: ${STRIPE_CANCEL_URL}
      SERVER_PORT: 8080
    ports:
      - "8080:8080"
    volumes:
      # PDF files are written to local disk by S3Service — mount a persistent volume
      - pdf_storage:/app/pdfs
    depends_on:
      pdf-service:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  frontend:
    image: saurabh896/clinical-management-frontend:latest
    container_name: clinical-management-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

  pdf-service:
    image: saurabh896/clinical-management-pdf-service:latest
    container_name: clinical-management-pdf-service
    restart: unless-stopped
    environment:
      CHROME_PATH: ""   # Leave empty — Docker image uses system Chromium via --no-sandbox
    ports:
      - "3001:3001"
    # Puppeteer in Docker needs extra shared memory
    shm_size: "1gb"

volumes:
  pdf_storage:
    driver: local