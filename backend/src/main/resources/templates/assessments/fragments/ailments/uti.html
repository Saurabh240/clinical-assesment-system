<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<div th:fragment="section">

  <div class="section-header">
    UTI Clinical Assessment
  </div>

  <div class="criteria-section">

    <div>
            <span class="checkbox"
                  th:text="${data['ailment']['clinicalBlock']['symptoms']['dysuria'] == true ? '☑' : '☐'}"></span>
      Dysuria
    </div>

    <div>
            <span class="checkbox"
                  th:text="${data['ailment']['clinicalBlock']['symptoms']['frequency'] == true ? '☑' : '☐'}"></span>
      Frequency / Urgency
    </div>

    <div>
            <span class="checkbox"
                  th:text="${data['ailment']['clinicalBlock']['symptoms']['suprapubicDiscomfort'] == true ? '☑' : '☐'}"></span>
      Suprapubic Discomfort
    </div>

    <br>

    <strong>Selected Treatment:</strong><br>
    <span class="field-value"
          th:text="${data['ailment']['clinicalBlock']['treatment']['selected']}">
        </span>

    <br>

    <span class="field-value"
          th:text="${data['ailment']['clinicalBlock']['treatment']['dose']}">
        </span>

  </div>

</div>

</body>
</html>
