<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Pharmacy Assessment</title>

    <style>
        * { box-sizing: border-box; }

        @page {
            size: A4;
            margin: 15mm 15mm 15mm 15mm;
        }

        body {
            font-family: Arial, sans-serif;
            font-size: 11px;
            line-height: 1.35;
            color: #000;
        }

        .container {
            width: 100%;
            border: 2px solid #000;
        }

        h1 {
            text-align: center;
            font-size: 15px;
            margin: 8px 0;
            padding: 8px;
            background-color: #e5e5e5;
            border-bottom: 2px solid #000;
        }

        h2 {
            font-size: 13px;
            font-weight: bold;
            margin: 0;
            padding: 6px 8px;
            border-bottom: 1px solid #000;
            border-top: 2px solid #000;
        }

        .section-header {
            background-color: #d9d9d9;
            font-weight: bold;
            padding: 6px;
            border-top: 2px solid #000;
            border-bottom: 1px solid #000;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
        }

        td, th {
            border: 1px solid #000;
            padding: 4px;
            vertical-align: top;
        }

        .checkbox {
            font-size: 12px;
        }

        .field-label {
            font-weight: bold;
        }

        .field-value {
            font-weight: normal;
        }

        /* Page break before ailment-specific section */
        .page-break {
            page-break-before: always;
            break-before: page;
        }

    </style>
</head>

<body>
<div class="container">

    <!-- ================= TITLE ================= -->
    <h1>ON Minor Ailment Assessment and Prescription</h1>

    <!-- 1. Patient Information + Prescriber Information -->
    <div th:replace="~{assessments/fragments/common/patient-info :: section(data=${data})}"></div>

    <!-- 2. Informed Consent -->
    <div th:replace="~{assessments/fragments/common/consent :: section(data=${data})}"></div>

    <!-- 3. Eligibility -->
    <div th:replace="~{assessments/fragments/common/eligibility-common :: section(data=${data})}"></div>

    <!-- 4. Assessment -->
    <div th:replace="~{assessments/fragments/common/assessment-common :: section(data=${data})}"></div>

    <!-- ================= PAGE BREAK — Ailment starts on Page 2 ================= -->
    <div class="page-break"></div>

    <!-- 5. Ailment-Specific Fragment -->
    <div th:switch="${data['ailment'] != null ? data['ailment']['code'] : ''}">

        <div th:case="'UTI'"
             th:replace="~{assessments/fragments/ailments/uti :: section(data=${data})}">
        </div>

        <!--        <div th:case="'DERMATITIS'"-->
        <!--             th:replace="~{assessments/fragments/ailments/dermatitis :: section(data=${data})}">-->
        <!--        </div>-->

        <!--        <div th:case="'DYSMENORRHEA'"-->
        <!--             th:replace="~{assessments/fragments/ailments/dysmenorrhea :: section(data=${data})}">-->
        <!--        </div>-->

        <!--        <div th:case="'OSELTAMIVIR'"-->
        <!--             th:replace="~{assessments/fragments/ailments/tamiflu :: section(data=${data})}">-->
        <!--        </div>-->

    </div>

    <!-- 6. Care Plan -->
    <div th:replace="~{assessments/fragments/common/care-plan :: section(data=${data})}"></div>

    <!-- 7. Medication Order -->
    <div th:replace="~{assessments/fragments/common/medication-order :: section(data=${data})}"></div>

    <!-- 8. Signature -->
    <div th:replace="~{assessments/fragments/common/signature :: section(data=${data})}"></div>

    <!-- 9. Monitoring and Follow Up -->
    <div th:replace="~{assessments/fragments/common/followup :: section(data=${data})}"></div>

</div>
</body>
</html>
