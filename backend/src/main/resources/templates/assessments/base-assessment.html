<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Pharmacy Assessment</title>

    <style>
        * { box-sizing: border-box; }

        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            font-size: 12px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            border: 2px solid #000;
            overflow: hidden;
        }

        h1 {
            text-align: center;
            font-size: 16px;
            margin: 10px 0;
            padding: 10px;
            background-color: #f0f0f0;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
        }

        td, th {
            border: 1px solid #000;
            padding: 5px;
            vertical-align: top;
            word-wrap: break-word;
        }

        .section-header {
            background-color: #d0d0d0;
            font-weight: bold;
            padding: 6px;
            margin-top: 15px;
        }

        .field-label {
            font-weight: bold;
        }

        .field-value {
            display: inline-block;
            border-bottom: 1px solid #000;
            min-width: 80px;
            padding: 2px 5px;
        }

        .checkbox {
            font-family: monospace;
            font-size: 14px;
            margin-right: 3px;
        }

        .criteria-section {
            padding: 10px;
            background-color: #f9f9f9;
        }

        .notes-area {
            width: 100%;
            min-height: 60px;
            border: 1px solid #ccc;
            padding: 5px;
        }

    </style>
</head>

<body>
<div class="container">

    <h1 th:text="${data['ailment'] != null ? data['ailment']['displayName'] + ' Pharmacy Assessment and Prescription' : 'Pharmacy Assessment'}">
    </h1>

    <!-- COMMON FRAGMENTS -->
    <div th:replace="~{assessments/fragments/common/patient-info :: section}"></div>
    <div th:replace="~{assessments/fragments/common/consent :: section}"></div>

    <!-- AILMENT FRAGMENT -->
    <div th:switch="${data['ailment'] != null ? data['ailment']['code'] : ''}">
        <div th:case="'UTI'"
             th:replace="~{assessments/fragments/ailments/uti :: section}">
        </div>

<!--        <div th:case="'OSELTAMIVIR'"-->
<!--             th:replace="~{assessments/fragments/ailments/tamiflu :: section}">-->
<!--        </div>-->
    </div>

    <!-- COMMON FOOTER FRAGMENTS -->
    <div th:replace="~{assessments/fragments/common/care-plan :: section}"></div>
    <div th:replace="~{assessments/fragments/common/signature :: section}"></div>
    <div th:replace="~{assessments/fragments/common/followup :: section}"></div>

</div>
</body>
</html>
