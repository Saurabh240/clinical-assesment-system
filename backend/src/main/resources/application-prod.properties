# ============================================================
#  RxPrescribe Clinical Assessment System
#  Spring Boot ? PRODUCTION / STAGING profile
#  All secrets must be injected via environment variables.
#  Never commit real values to source control.
# ============================================================

# ?? Active profile ???????????????????????????????????????????
spring.profiles.active=prod

# ?? Database ?????????????????????????????????????????????????
# Override with: SPRING_DATASOURCE_URL, _USERNAME, _PASSWORD
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection pool (HikariCP defaults are fine; tune if needed)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ?? JPA / Hibernate ??????????????????????????????????????????
# validate = confirm schema matches entities at startup; never auto-create in prod
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ?? Flyway ???????????????????????????????????????????????????
spring.flyway.enabled=true
spring.flyway.locations=classpath:db
spring.flyway.baseline-on-migrate=true

# ?? Logging ??????????????????????????????????????????????????
logging.level.root=WARN
logging.level.com.clinical=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate=WARN

# ?? JWT ??????????????????????????????????????????????????????
# Must be 256-bit (32+ chars) random strings ? generate with:
#   openssl rand -base64 32
jwt.access-secret=${JWT_ACCESS_SECRET}
jwt.refresh-secret=${JWT_REFRESH_SECRET}

# ?? CORS ?????????????????????????????????????????????????????
# Comma-separated list of allowed origins (your staging frontend URL)
# Example: https://staging.rxprescribe.com
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# ?? PDF service ??????????????????????????????????????????????
pdf.service.url=${PDF_SERVICE_URL}

# ?? S3 / PDF storage ?????????????????????????????????????????
# NOTE: S3Service currently writes PDFs to local disk ("pdfs/" folder).
# For staging, override the public base URL so links resolve correctly.
# Before production, replace S3Service with real S3/object-storage upload.
app.pdf.base-url=${PDF_BASE_URL:http://localhost:8080}

# ?? Stripe ???????????????????????????????????????????????????
payment.stripe.secretKey=${STRIPE_SECRET_KEY}
payment.stripe.publishableKey=${STRIPE_PUBLISHABLE_KEY}
payment.stripe.webhookSecret=${STRIPE_WEBHOOK_SECRET}
payment.stripe.currency=CAD

stripe.price.monthly=${STRIPE_PRICE_MONTHLY}
stripe.price.annual=${STRIPE_PRICE_ANNUAL}
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET}

stripe.redirect.success-url=${STRIPE_SUCCESS_URL}
stripe.redirect.cancel-url=${STRIPE_CANCEL_URL}

# ?? Pagination ???????????????????????????????????????????????
app.pagination.default-page=0
app.pagination.default-size=10
app.pagination.max-size=50

# ?? Thymeleaf (PDF templates) ????????????????????????????????
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.cache=true

# ?? Server ???????????????????????????????????????????????????
server.port=${SERVER_PORT:8080}
# Trust reverse-proxy headers (required when behind NGINX/load balancer)
server.forward-headers-strategy=framework

# ?? Actuator (optional ? uncomment when you add spring-boot-actuator) ???
# management.endpoints.web.exposure.include=health,info
# management.endpoint.health.show-details=when-authorized